<app-loading *ngIf="loading"></app-loading>

<div *ngIf="!loading && holidayRows.length === 0" class="holidays-empty" data-test="holidays-empty">
  <fa-icon [icon]="['fas', 'umbrella-beach']" aria-hidden="true"></fa-icon>

  <!-- History has no configure CTA: importing only ever fills upcoming dates, never the past. -->
  <ng-container *ngIf="scope === 'History'">
    <div>{{ "pages.time-off.HOLIDAYS_EMPTY_HISTORY" | translate }}</div>
  </ng-container>

  <ng-container *ngIf="scope !== 'History'">
    <div>{{ "pages.time-off.HOLIDAYS_EMPTY" | translate }}</div>
    <app-button color="success" look="solid" [text]="'pages.time-off.HOLIDAYS_CONFIGURE_CTA' | translate"
      (onClick)="configure.emit()" data-test="holidays-configure-cta"></app-button>
  </ng-container>
</div>

<app-single-time-off-list-item *ngFor="let row of holidayRows" [view]="row.view"
  (onOpenView)="onHolidayRowClick(row.holiday)">
</app-single-time-off-list-item>

<div class="loading-more" *ngIf="loadingMore"><app-loading [hasShadow]="false"></app-loading></div>

<!-- An active (linked) holiday is just a time-off — open it by id like any other. -->
<app-dialog #detailsDialog>
  <app-single-time-off *ngIf="detailsDialog.isOpen" [id]="viewingId"
    (onChanged)="refresh()" (onDone)="detailsDialog.close()"></app-single-time-off>
</app-dialog>

<!-- A removed holiday has no TimeOff to load by id, so it has its own view keyed on the ImportedHoliday. -->
<app-dialog #removedHolidayDialog>
  <app-removed-holiday *ngIf="removedHolidayDialog.isOpen" [importedHolidayId]="viewingRemovedHolidayId"
    (onChanged)="refresh()" (onDone)="removedHolidayDialog.close()"></app-removed-holiday>
</app-dialog>
