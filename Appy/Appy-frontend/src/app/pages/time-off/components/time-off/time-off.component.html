<div class="page">
  <div class="w-title">{{ "pages.time-off.TIME_OFF" | translate }}</div>

  <app-segmented-control class="tabs" dataTest="time-off-tabs" [options]="tabOptions" [value]="activeTab"
    (valueChange)="setTab($event)"></app-segmented-control>

  <!-- Scope toggle + primary action share one row: add-new on the list tabs, configure-import on Holidays. -->
  <div class="controls">
    <app-segmented-control size="compact" dataTest="time-off-scope" [options]="scopeOptions" [value]="scope"
      (valueChange)="setScope($event)"></app-segmented-control>

    <!-- Icon-only so the row never wraps on narrow screens (long labels, esp. in Croatian, forced a wrap);
         title/aria-label keep the action discoverable. -->
    <app-button *ngIf="!isHolidays" icon="plus" color="success" look="solid" alignContent="center" (onClick)="addNew()"
      data-test="time-off-add" [attr.title]="'pages.time-off.ADD' | translate"
      [attr.aria-label]="'pages.time-off.ADD' | translate"></app-button>

    <app-button *ngIf="isHolidays" icon="gear" alignContent="center" (onClick)="openConfigure()"
      data-test="time-off-configure-import" [attr.title]="'pages.time-off.CONFIGURE_AUTO_IMPORT' | translate"
      [attr.aria-label]="'pages.time-off.CONFIGURE_AUTO_IMPORT' | translate"></app-button>
  </div>

  <app-time-off-list *ngIf="!isHolidays" [type]="listType" [scope]="scope"
    (openDetails)="viewingId = $event; detailsDialog.open()">
  </app-time-off-list>

  <app-holiday-list *ngIf="isHolidays" [scope]="scope" (configure)="openConfigure()"></app-holiday-list>
</div>

<!-- The One-off/Recurring list rows open the time-off details dialog by id. -->
<app-dialog #detailsDialog>
  <app-single-time-off *ngIf="detailsDialog.isOpen" [id]="viewingId"
    (onDone)="detailsDialog.close()"></app-single-time-off>
</app-dialog>

<app-holiday-configure-dialog (saved)="onSettingsSaved()"></app-holiday-configure-dialog>
