<div class="page">
  <div class="w-title">{{ "pages.time-off.TIME_OFF" | translate }}</div>

  <div class="tabs" data-test="time-off-tabs">
    <button *ngFor="let t of tabs" class="tab" type="button" [class.active]="activeTab === t.tab"
      (click)="setTab(t.tab)" [attr.data-test]="'time-off-tab-' + t.tab.toLowerCase()">
      {{ t.labelKey | translate }}
    </button>
  </div>

  <!-- Scope toggle + primary action share one row: add-new on the list tabs, configure-import on Holidays. -->
  <div class="controls">
    <div class="scope-switch" data-test="time-off-scope">
      <button class="scope" type="button" [class.active]="scope === 'Active'" (click)="setScope('Active')"
        data-test="time-off-scope-upcoming">{{ "pages.time-off.UPCOMING" | translate }}</button>
      <button class="scope" type="button" [class.active]="scope === 'Expired'" (click)="setScope('Expired')"
        data-test="time-off-scope-past">{{ "pages.time-off.PAST" | translate }}</button>
    </div>

    <!-- Icon-only so the row never wraps on narrow screens (long labels, esp. in Croatian, forced a wrap);
         title/aria-label keep the action discoverable. -->
    <app-button *ngIf="!isHolidays" icon="plus" color="success" look="outlined" borderStyle="dashed"
      alignContent="center" (onClick)="addNew()" data-test="time-off-add"
      [attr.title]="'pages.time-off.ADD' | translate" [attr.aria-label]="'pages.time-off.ADD' | translate"></app-button>

    <app-button *ngIf="isHolidays" icon="gear" color="success" look="outlined" borderStyle="dashed"
      alignContent="center" (onClick)="configureAutoImport()" data-test="time-off-configure-import"
      [attr.title]="'pages.time-off.CONFIGURE_AUTO_IMPORT' | translate"
      [attr.aria-label]="'pages.time-off.CONFIGURE_AUTO_IMPORT' | translate"></app-button>
  </div>

  <app-time-off-list *ngIf="!isHolidays" [type]="listType" [scope]="scope"
    (openDetails)="viewingId = $event; detailsDialog.open()">
  </app-time-off-list>

  <div *ngIf="isHolidays" class="holidays-stub" data-test="time-off-holidays-stub">
    <fa-icon [icon]="['fas', 'umbrella-beach']" aria-hidden="true"></fa-icon>
    <div>{{ "pages.time-off.HOLIDAYS_COMING_SOON" | translate }}</div>
  </div>
</div>

<app-dialog #detailsDialog>
  <app-single-time-off *ngIf="detailsDialog.isOpen" [id]="viewingId"
    (onDone)="detailsDialog.close()"></app-single-time-off>
</app-dialog>
