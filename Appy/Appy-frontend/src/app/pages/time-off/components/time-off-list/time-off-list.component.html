<app-loading *ngIf="loading"></app-loading>

<div *ngIf="!loading" data-test="time-off-list">
  <div *ngIf="rows.length === 0" class="empty" data-test="time-off-list-empty">
    <fa-icon [icon]="['fas', 'umbrella-beach']" aria-hidden="true"></fa-icon>
    <span>{{ (scope === "Active" ? "pages.time-off.NONE_UPCOMING" : "pages.time-off.NONE_HISTORY") | translate }}</span>
  </div>

  <app-single-time-off-list-item
    *ngFor="let row of rows"
    [view]="row.view"
    (onOpenView)="openDetails.emit(row.id)">
  </app-single-time-off-list-item>

  <div class="loading-more" *ngIf="loadingMore">
    <app-loading [hasShadow]="false"></app-loading>
  </div>
</div>
